server {
 listen 80;
 server_name admin.influencerock.com;
 location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
 location / { return 301 https://admin.influencerock.com$request_uri; }
}
server {
 listen 443 ssl;
 server_name admin.influencerock.com;
 ssl_certificate /etc/letsencrypt/live/admin.influencerock.com/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/admin.influencerock.com/privkey.pem;
 include /etc/letsencrypt/options-ssl-nginx.conf;
 ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
 add_header X-Robots-Tag "noindex, nofollow" always;
 client_max_body_size 16k;
 location / {
  proxy_pass http://127.0.0.1:3182;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
 }
}
